[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-persona-skill"
version = "2.5.0"
description = "Web Persona toolkit — multi-book persona methodology system, integrating Mulder + Cooper + Pruitt-Adlin + Goodwin + Indi Young + Lene Nielsen + Lean UX + 5 more classic works (多书系融合的人物角色方法论体系)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "AliDujie"}]
keywords = ["persona", "user-research", "user-segmentation", "design-guidance", "openclaw-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

[project.urls]
Homepage = "https://github.com/AliDujie/web-persona-skill"
Repository = "https://github.com/AliDujie/web-persona-skill"
Issues = "https://github.com/AliDujie/web-persona-skill/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["persona*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
