[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-persona-skill"
version = "2.7.0"
description = "Web Persona toolkit v2.7 — 30+ classic books persona methodology. v2.7 adds upstream research craft (Portigal interviewing / Fitzpatrick Mom Test / Torres continuous discovery / Alvarez lean CustDev) + experience mapping & narrative (Kalbach mapping / Quesenbery storytelling / Kuniavsky observing / Christensen JTBD origin). Integrates Mulder/Cooper/Pruitt-Adlin/Goodwin/Indi Young/Lean UX + v2.6 quantitative/psychology/ethics/engineering + 4 Python modules (clustering / llm_prompts / okr_bridge / measurement_toolkit)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "AliDujie"}]
keywords = ["persona", "user-research", "user-segmentation", "design-guidance", "openclaw-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

[project.urls]
Homepage = "https://github.com/AliDujie/web-persona-skill"
Repository = "https://github.com/AliDujie/web-persona-skill"
Issues = "https://github.com/AliDujie/web-persona-skill/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["persona*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
