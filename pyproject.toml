[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-persona-skill"
version = "3.0.0"
description = "Web Persona toolkit v3.0 — Complete restructure. 8 core operation manuals (project setup → qualitative/quantitative/mixed → analysis → creation → validation → application) + 39 advanced references + 4 Python modules (clustering / llm_prompts / okr_bridge / measurement_toolkit). Integrates 30+ classic works (Cooper/Mulder/NNGroup/Portigal/Kahneman/etc.) organized by execution stage, not by book."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "AliDujie"}]
keywords = ["persona", "user-research", "user-segmentation", "design-guidance", "openclaw-skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]

[project.urls]
Homepage = "https://github.com/AliDujie/web-persona-skill"
Repository = "https://github.com/AliDujie/web-persona-skill"
Issues = "https://github.com/AliDujie/web-persona-skill/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
include = ["persona*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
